name: Axoni
description: >-
  Axoni is a New York-based financial data infrastructure company that provides
  real-time, automated replication of data between institutions, reducing
  reconciliations, data pipeline management cost, and operational risk across
  capital markets. Its platform lets banks, asset managers, and market
  infrastructure providers rapidly deploy critical financial networks and share
  post-trade data in real time. Axoni is used by leading institutions including
  JPMorgan, Deutsche Bank, BlackRock, and Citigroup, and has been recognized by
  Risk.net, the A-Team Group, and Forbes Fintech 50. The company is SOC 2 Type 2
  certified and is backed by a16z and DCVC. Axoni does not currently publish a
  public developer portal, API reference, or SDKs; its documentation surface is
  access-gated to customers.
